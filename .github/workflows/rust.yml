name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Install system dependencies
      # The egui/plotters examples pull in font-kit, whose fontconfig-sys build
      # script needs the system fontconfig and freetype development packages.
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          pkg-config \
          libfontconfig1-dev \
          libfreetype6-dev
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
