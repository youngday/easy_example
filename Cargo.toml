[package]
name = "easy_example"
version = "0.5.0"
authors = ["youngday"]
edition = "2024"

[features]
default = ["platform-verifier", "ring", "runtime-tokio", "rustls"]
# Records how long locks are held, and warns if they are held >= 1ms
lock_tracking = []
# Provides `ClientConfig::with_platform_verifier()` convenience method
platform-verifier = ["proto/platform-verifier"]
rustls = ["dep:rustls", "proto/rustls", "proto/ring"]
# Enables `Endpoint::client` and `Endpoint::server` conveniences
ring = ["proto/ring"]
runtime-tokio = ["tokio/time", "tokio/rt", "tokio/net"]
runtime-smol = ["async-io", "smol"]

[dependencies]
config = "0.15.24"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
once_cell = { version = "1.21.4" }
bytes = "1.12.0"
assert2 = "0.4.0"
trybuild = "1.0.117"
criterion = "0.8.2"
anyhow = "1.0.102"


serde = { version = "1.0.228", features = ["derive"] }
serde_derive = "1.0.228"
# serde_yaml = "0.9.34+deprecated"
tokio = { version = "1.52.3", features = ["full", "macros", "tracing"] }
tokio-rustls = "0.26.4"
rustls-pemfile = "2.2.0"
tokio-stream = { version = "0.1.18", features = ["net"] }
tokio-util = { version = "0.7.18", features = ["full"] }
tokio-serial = "5.5.0"
reqwest = { version = "0.13.4", features = ["json"] }
futures = { version = "0.3.32", default-features = false, features = ["alloc"] }
futures-util = { version = "0.3.32", default-features = false, features = [
    "sink",
    "std",
] }

tmq = { version = "0.5.0" }

rumqttc = "0.25.1"
rumqttd = "0.20.0"
base64 = "0.23.1"

ndarray = "0.17.2"
rand = "0.10.1"
rand_distr = "0.6.0"
itertools = "0.15.0"
csv = "1.4.0"
image = "0.25.10"

iceoryx2 = "0.10.0"
iceoryx2-bb-container = "0.10.0"


# network
hyper = { version = "1.10.1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
http-body-util = { version = "0.1.3" }
axum = { version = "0.8.9", features = ["ws"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }

poem = "3.1.12"
webpki-roots = "1.0.8"


headers = "0.4.1"

tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["fs", "trace"] }
# 如果需要写文件
fastwebsockets = { version = "0.10.0", features = ["upgrade"] }

# quinn++++++++++++++++++++++++++++++++++++++++++++
async-io = { version = "2.6.0", optional = true }
# async-std = { version = "1.13.2", optional = true }
# Enables futures::io::{AsyncRead, AsyncWrite} support for streams
futures-io = { version = "0.3.32", optional = true }
rustc-hash = "2.1.2"
pin-project-lite = "0.2.17"
quinn = "0.11.11"
proto = { package = "quinn-proto", version = "0.11.15", default-features = false }
protoc-rust = "2.28.0"
rustls = { version = "0.23.40", default-features = true, features = [
    "ring",
    "std",
], optional = true }
smol = { version = "2.0.2", optional = true }
thiserror = "2.0.18"
udp = { package = "quinn-udp", version = "0.6.1", default-features = false }
#quinn----------------------------------------------

tokio-tungstenite = "0.30.0"
tungstenite = "0.30.0"
serde_yaml = "0.9.34"
zenoh = "1.10.1"
serde_json = "1.0.151"


[dev-dependencies]
# quinn++++++++++++++++++++++++++++++++++++++++++++
crc = "3.4.0"
bencher = "0.1.5"
directories-next = "2.0.0"
rand = "0.10.1"
rcgen = "0.14.8"
rustls-pemfile = "2.2.0"
clap = { version = "4.6.1", features = ["derive"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "env-filter",
    "fmt",
    "ansi",
    "time",
    "local-time",
] }
tracing-futures = { version = "0.2.5", default-features = false, features = [
    "std-future",
] }
url = "2.5.8"
#quinn----------------------------------------------

web-transport-quinn = "0.13.1"

# egui-plotter examples (native eframe windows); see examples/egui_plotter/
eframe = "0.36"
egui-plotter = { path = "vendor/egui-plotter", features = ["timechart"] }
plotters = "0.3"
# liveplot (crates.io, https://github.com/ulikoehler/liveplot-rs) — alternative
# realtime egui plotting UI; see examples/liveplot/
liveplot = "2.4"

[build-dependencies]
poem-grpc-build = "0.5.9"

# iceoryx2 publish_subscribe
[[example]]
name = "ice_pub"
path = "examples/dds_iceoryx2/publisher.rs"
[[example]]
name = "ice_sub"
path = "examples/dds_iceoryx2/subscriber.rs"
[[example]]
name = "discovery"
path = "examples/discovery/discovery.rs"

# zenoh publish_subscribe
[[example]]
name = "zenoh_pub"
path = "examples/dds_zenoh/publisher.rs"
[[example]]
name = "zenoh_sub"
path = "examples/dds_zenoh/subscriber.rs"

[[example]]
name = "zmq_pub"
path = "examples/zeromq_tmq/publish.rs"
[[example]]
name = "zmq_sub"
path = "examples/zeromq_tmq/subscriber.rs"
[[example]]
name = "zeromq_tmq"
path = "examples/zeromq_tmq/zeromq_tmq.rs"
# websocket
[[example]]
name = "ws_server"
path = "examples/websocket/src/main.rs"
[[example]]
name = "ws_client"
path = "examples/websocket/src/client.rs"
# websocket transport
[[example]]
name = "wt_server"
path = "examples/webtransport/src/echo-server.rs"
[[example]]
name = "wt_client"
path = "examples/webtransport/src/echo-client.rs"

[[example]]
name = "mqtt_asyncpubsub"
path = "examples/mqtt/mqtt_asyncpubsub.rs"

[[example]]
name = "rumqttd"
path = "examples/mqtt/rumqttd.rs"

# egui-plotter examples (vendored in vendor/egui-plotter, patched for egui 0.36)
[[example]]
name = "egui_3d"
path = "examples/egui_plotter/3d.rs"
[[example]]
name = "egui_timechart"
path = "examples/egui_plotter/timechart.rs"

# zenoh subscriber plotted live with egui-plotter's TimeData
[[example]]
name = "egui_timechart_live"
path = "examples/egui_plotter/timechart_live.rs"

# zenoh subscriber plotted live with the `liveplot` crate (crates.io)
[[example]]
name = "liveplot_zenoh"
path = "examples/liveplot/liveplot_zenoh.rs"
